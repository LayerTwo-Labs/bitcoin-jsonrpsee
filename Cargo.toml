[package]
name = "bitcoin-jsonrpsee"
version = "0.1.1"
edition = "2021"
license-file = "LICENSE.txt"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.0"
bitcoin = { version = "0.32.2", features = ["serde"] }
hashlink = { version = "0.12.1", features = ["serde_impl"] }
hex = { version = "0.4.3", features = ["serde"] }
http = "1.4.2"
jsonrpsee = { version = "0.26.0", features = ["client-core", "macros"] }
# Depended on directly rather than through the `jsonrpsee/http-client` feature,
# which always enables TLS. We only talk plain HTTP to bitcoind.
jsonrpsee-http-client = { version = "0.26.0", default-features = false }
serde ={ version = "1.0.229", features = ["alloc", "derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = { version = "0.1.44", optional = true }

[dependencies.educe]
version = "0.8.1"
default-features = false
features = ["Clone", "Debug"]

[dev-dependencies]
serde_path_to_error = "0.1.20"

[features]
tracing = ["jsonrpsee/tracing", "dep:tracing"]
